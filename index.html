<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Blink</title>
    <meta name="description" content="<%= siteDescription %>" />
    <meta name="author" content="josepdecid" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a1020" />
    <link rel="canonical" href="<%= siteUrl %>/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%= siteName %>" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="<%= siteName %>" />
    <meta property="og:description" content="<%= siteDescription %>" />
    <meta property="og:url" content="<%= siteUrl %>/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= siteName %>" />
    <meta name="twitter:description" content="<%= siteDescription %>" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "<%= siteName %>",
        "description": "<%= siteDescription %>",
        "url": "<%= siteUrl %>/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "josepdecid",
          "url": "https://github.com/josepdecid"
        },
        "codeRepository": "https://github.com/josepdecid/block-blink"
      }
    </script>
  </head>
  <body>
    <div id="root">
      <main class="game-shell">
        <header class="top-copy">
          <p class="prompt">Count the Blocks before they Blink.</p>
        </header>

        <div class="top-buttons">
          <button
            class="sound-toggle"
            id="sound-toggle"
            type="button"
            aria-label="Mute sound"
          >
            <img alt="" width="20" height="20" />
          </button>
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Toggle theme"
          >
            <img alt="" width="20" height="20" />
          </button>
        </div>

        <section class="play-area">
          <div class="hero-count" id="hero-count"></div>
          <canvas
            class="game-canvas"
            id="game-canvas"
            aria-label="Block counting game"
          ></canvas>
        </section>

        <aside id="results-panel" class="results-panel">
          <div class="results-content">
            <p class="results-label">Your Guess</p>
            <div class="guess-result">
              <span class="guess-number" id="guess-number">0</span>
            </div>
          </div>

          <div class="controls">
            <button
              id="increment-button"
              class="control-button"
              type="button"
              aria-label="Add block"
            >
              &#x002B;
            </button>
            <button
              id="submit-button"
              class="control-button control-button--primary"
              type="button"
            >
              &#x2713;
            </button>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
